<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timesheet — consol</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#3A3D42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #FCFBF9; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>

<iframe id="app" allow="clipboard-write; geolocation"></iframe>

<script>
// >>> URL /exec da implantação (atualize só se criar outra implantação) <<<
const EXEC = 'https://script.google.com/macros/s/AKfycbzNMcvYcrHaPcw3QiQXmtMrC9MdloS1cB5dyP_ElbNEhOV9Q3nKK-iONhiWCmV5L6xK/exec';

const CHAVE = 'timesheet-aparelho';   // identificador fixo deste aparelho

function novoId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.from(b).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}

/** Devolve o identificador deste aparelho, criando e guardando um na primeira vez. */
function idAparelho(trocar) {
  let v = null;
  try { v = localStorage.getItem(CHAVE); } catch (e) {}
  if (!v || trocar) {
    v = novoId();
    try { localStorage.setItem(CHAVE, v); } catch (e) {}
  }
  return v;
}

function abrirApp(dt) {
  document.getElementById('app').src = EXEC + '?pwa=1' + (dt ? '&dt=' + encodeURIComponent(dt) : '');
}

window.addEventListener('message', function (e) {
  let host = '';
  try { host = new URL(e.origin).hostname; } catch (err) { return; }
  if (!/\.googleusercontent\.com$/.test(host)) return;

  const msg = e.data || {};

  // sign out: este aparelho ganha um identificador novo, desligado do usuário anterior
  if (msg.tipo === 'trocar-aparelho' || msg.tipo === 'sair') {
    idAparelho(true);
  }

  // o app pediu a localização (o iframe do Google não tem acesso ao GPS)
  if (msg.tipo === 'pedir-local') {
    const responder = function (r) {
      r.tipo = 'local';
      r.id = msg.id;
      e.source.postMessage(r, e.origin);
    };
    if (!navigator.geolocation) return responder({ ok: false, erro: 'no GPS on this device' });
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        responder({ ok: true, lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy });
      },
      function (err) { responder({ ok: false, codigo: err.code, erro: err.message }); },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  }
});

// O identificador vai sempre na URL: o app entra direto se já conhecer este aparelho,
// e passa a conhecê-lo assim que você fizer o login por e-mail uma vez.
abrirApp(idAparelho(false));

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
}
</script>
</body>
</html>

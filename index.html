<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timesheet — consol</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#3A3D42">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #FCFBF9; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>

<iframe id="app" allow="clipboard-write; geolocation"></iframe>

<script>
// >>> URL /exec da implantação (atualize só se criar outra implantação) <<<
const EXEC = 'https://script.google.com/macros/s/AKfycbzNMcvYcrHaPcw3QiQXmtMrC9MdloS1cB5dyP_ElbNEhOV9Q3nKK-i0NhiWCmV5L6xK/exec';

const CHAVE = 'timesheet-aparelho';   // guarda { dt, email }

function ler() {
  try { return JSON.parse(localStorage.getItem(CHAVE) || 'null'); } catch (e) { return null; }
}

function gravar(v) {
  try { v ? localStorage.setItem(CHAVE, JSON.stringify(v)) : localStorage.removeItem(CHAVE); } catch (e) {}
}

function abrirApp(dt) {
  document.getElementById('app').src = EXEC + '?pwa=1' + (dt ? '&dt=' + encodeURIComponent(dt) : '');
}

window.addEventListener('message', function (e) {
  let host = '';
  try { host = new URL(e.origin).hostname; } catch (err) { return; }
  if (!/\.googleusercontent\.com$/.test(host)) return;

  const msg = e.data || {};

  // o app acabou de logar e mandou a chave deste aparelho
  if (msg.tipo === 'dispositivo' && msg.dt) {
    gravar({ dt: msg.dt, email: msg.email });
  }

  // sign out, ou chave recusada pelo servidor
  if (msg.tipo === 'sair' || msg.tipo === 'dispositivo-invalido') {
    gravar(null);
  }

  // o app pediu a localização (o iframe do Google não tem acesso ao GPS)
  if (msg.tipo === 'pedir-local') {
    const responder = function (r) {
      r.tipo = 'local';
      r.id = msg.id;
      e.source.postMessage(r, e.origin);
    };
    if (!navigator.geolocation) return responder({ ok: false, erro: 'no GPS on this device' });
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        responder({ ok: true, lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy });
      },
      function (err) { responder({ ok: false, codigo: err.code, erro: err.message }); },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  }
});

// Abre direto com a chave guardada; sem chave, o app mostra a tela de login.
const salvo = ler();
abrirApp(salvo && salvo.dt ? salvo.dt : '');

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
}
</script>
</body>
</html>
